<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewards Search Automator</title>
    <link rel="shortcut icon" href="/logo/bing.png" type="image/x-icon" />
    <link rel="stylesheet" href="/css/popup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <header>
      <a
        class="nav active"
        href="#search"
        title="Search options"
        data-open="search"
        aria-current="page"
        >Search</a
      >
      <a
        class="nav"
        href="#schedule"
        title="Schedule options"
        data-open="schedule"
        >Schedule</a
      >
      <a class="nav" href="#settings" title="Settings" data-open="settings"
        >Settings</a
      >
    </header>
    <main>
      <section id="search">
        <p class="runStatus" role="status" hidden></p>
        <div class="tile">
          <div class="input">
            <label for="searchDesk">Desktop</label>
            <input type="number" name="searchDesk" id="searchDesk" />
          </div>
          <div class="input">
            <label for="searchMob">Mobile</label>
            <input type="number" name="searchMob" id="searchMob" />
          </div>
          <div class="progressBar">
            <div class="progress"></div>
            <div class="failed"></div>
          </div>
        </div>
        <div class="tile">
          <div class="input">
            <label for="searchMin">Min. Delay</label>
            <input type="number" name="searchMin" id="searchMin" />
          </div>
          <div class="input">
            <label for="searchMax">Max. Delay</label>
            <input type="number" name="searchMax" id="searchMax" />
          </div>
        </div>
        <div id="searchMode" class="mode">
          <a
            class="m1"
            title="0 Mobile and 30 PC points"
            type="button"
            role="button"
            >1 - 0</a
          >
          <a
            class="m2"
            title="30 Mobile and 60 PC points"
            type="button"
            role="button"
            >0 - 1</a
          >
          <a
            class="m3"
            title="60 Mobile and 90 PC points"
            type="button"
            role="button"
            >0 - 21</a
          >
          <a
            class="m4"
            title="90 Mobile and 150 PC points"
            type="button"
            role="button"
            >Custom</a
          >
        </div>
        <button
          id="searchTrigger"
          class="trigger"
          title="Start/Stop Searches"
          type="button"
          role="button"
        >
          Search
        </button>
      </section>
      <section id="schedule" hidden>
        <p class="runStatus" role="status" hidden></p>
        <div class="tile">
          <div class="input">
            <label for="scheduleDesk">Desktop</label>
            <input type="number" name="scheduleDesk" id="scheduleDesk" />
          </div>
          <div class="input">
            <label for="scheduleMob">Mobile</label>
            <input type="number" name="scheduleMob" id="scheduleMob" />
          </div>
          <div class="progressBar">
            <div class="progress"></div>
            <div class="failed"></div>
          </div>
        </div>
        <div class="tile">
          <div class="input">
            <label for="scheduleMin">Min. Delay</label>
            <input type="number" name="scheduleMin" id="scheduleMin" />
          </div>
          <div class="input">
            <label for="scheduleMax">Max. Delay</label>
            <input type="number" name="scheduleMax" id="scheduleMax" />
          </div>
        </div>
        <div id="scheduleMode" class="mode">
          <a
            class="m1"
            title="Schedule won't run automatically"
            type="button"
            role="button"
            >Manual Only</a
          >
          <a
            class="m2"
            title="Schedule will run automatically when browser starts"
            type="button"
            role="button"
            >At Startup</a
          >
          <a
            class="m3"
            title="Schedule will run automatically every ~5 minutes (randomised)"
            type="button"
            role="button"
            >Every ~5 Minutes</a
          >
          <a
            class="m4"
            title="Schedule will run automatically every ~15 minutes (randomised)"
            type="button"
            role="button"
            >Every ~15 Minutes</a
          >
        </div>
        <button
          id="scheduleTrigger"
          class="trigger"
          title="Start/Stop Schedule"
          type="button"
          role="button"
        >
          Schedule
        </button>
      </section>
      <section id="settings" hidden>
        <div class="menuItem">
          <label for="version"> Version: </label>
          <input type="text" name="version" id="version" value="" readonly />
        </div>
        <div class="menuItem">
          <label for="userManual">User Manual:</label>
          <button type="button" role="link" id="userManual">Open</button>
        </div>
        <div class="menuItem">
          <label for="resetDevice" id="deviceName">Test Device</label>
          <a
            id="resetDevice"
            title="Click to re-assign a new Simulation Device (randomised)"
          >
            <span class="material-symbols-outlined">refresh</span>
          </a>
        </div>
        <div class="menuItem">
          <label for="clear">Refresh Bing cache for Mobile searches:</label>
          <input type="checkbox" name="clear" id="clear" checked />
        </div>
        <div class="menuItem">
          <label for="preserveRewards"
            >Keep Microsoft login during mobile:</label
          >
          <input
            type="checkbox"
            name="preserveRewards"
            id="preserveRewards"
            checked
            disabled
          />
        </div>
        <div class="menuItem">
          <label for="log">Show Advance Logs:</label>
          <input type="checkbox" name="log" id="log" />
        </div>
        <div class="menuItem">
          <label for="niche">Search Niche:</label>
          <select name="niche" id="niche">
            <option value="random" selected>Random</option>
            <option value="tech">Tech</option>
            <option value="sports">Sports</option>
            <option value="food">Food</option>
            <option value="health">Health</option>
            <option value="finance">Finance</option>
            <option value="science">Science</option>
            <option value="gaming">Gaming</option>
            <option value="nature">Nature</option>
            <option value="history">History</option>
            <option value="vietnam">Vietnam</option>
          </select>
        </div>
        <div class="menuItem">
          <label for="activity">Perform Activities:</label>
          <button
            id="activity"
            title="Perform daily rewards activities"
            type="button"
            role="button"
          >
            Perform
          </button>
          <div class="progressBar">
            <div class="progress act"></div>
          </div>
        </div>
        <div class="menuItem">
          <label for="act">Automate Activities after searches:</label>
          <input
            type="checkbox"
            name="act"
            id="act"
            title="Enable/Disable Automate Activities after search"
          />
        </div>
        <div class="menuItem">
          <label for="clearBrowsingData">Clear Bing data &amp; login:</label>
          <button
            id="clearBrowsingData"
            title="Manually clear Bing cookies and storage; this can sign you out"
            type="button"
            role="button"
          >
            Clear
          </button>
        </div>
        <div class="menuItem">
          <label for="simulate">Simulate Tab:</label>
          <button
            id="simulate"
            title="Toggle Simulate tab with selected Simulation device"
            type="button"
            role="button"
          >
            Toggle
          </button>
        </div>
        <div class="menuItem">
          <label for="download"
            >Download search history (24h, up to 10k):</label
          >
          <button
            id="download"
            title="Download Bing search history from the last 24 hours (paginated, deduped, max 10,000 entries)"
            type="button"
            role="button"
          >
            Download
          </button>
        </div>
        <div class="menuItem">
          <label for="delete">Delete Bing search history (up to 10k):</label>
          <button
            id="delete"
            title="Finds Bing history URLs from the last 24h, then removes each URL from history. NOTE: Chrome deletes ALL visits to those URLs, not just the last 24 hours."
            type="button"
            role="button"
          >
            Delete
          </button>
        </div>
        <div class="menuItem">
          <label for="downloadCrashLog">Download crash log:</label>
          <button
            id="downloadCrashLog"
            title="Download the persistent crash/error log as a text file for analysis"
            type="button"
            role="button"
          >
            Download
          </button>
        </div>
        <div class="menuItem">
          <label for="clearCrashLog">Clear crash log:</label>
          <button
            id="clearCrashLog"
            title="Delete all stored crash/error log entries"
            type="button"
            role="button"
          >
            Clear
          </button>
        </div>
        <div class="menuItem">
          <label for="runtime">Reset Runtime data:</label>
          <button
            id="runtime"
            title="Reset Runtime data of the extension"
            type="button"
            role="button"
          >
            Reset
          </button>
        </div>
        <div class="menuItem">
          <label for="reset">Reset Extension:</label>
          <button
            id="reset"
            title="Reset the extension to its default settings"
            type="button"
            role="button"
          >
            Reset
          </button>
        </div>
      </section>
    </main>
  </body>
  <script src="/js/popup.js" type="module"></script>
</html>
